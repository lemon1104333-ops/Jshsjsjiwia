<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>伊丹と太鼓 3D</title>
<style>
:root{color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:#05030a;color:#efe6d2;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:linear-gradient(transparent,#000a 40%)}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:.95rem;opacity:.85;pointer-events:none}
p{margin:0;line-height:1.6}
.say{font-size:1.15rem;border:2px solid #efe6d2;background:#000c;padding:10px 16px;border-radius:4px;min-width:60%}
button{font:inherit;color:#efe6d2;background:#1a0f0fdd;border:2px solid #efe6d2;padding:12px 22px;border-radius:4px;cursor:pointer;touch-action:manipulation}
button:active{background:#d9232d}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.songs{display:flex;flex-direction:column;gap:6px;width:min(420px,100%)}
.songs button{text-align:left;padding:9px 16px}
.card{border:2px solid #efe6d2;background:#000c;padding:10px 22px}.card b{font-size:2rem;color:#ff4450}
.pad button{width:42vw;max-width:190px;height:84px;font-size:1.4rem;border-radius:50%}
#don{background:#d9232d;border-color:#d9232d}#ka{background:#2a8fd6;border-color:#2a8fd6}
.big{font-size:1.9rem;color:#ff2030;font-weight:bold;text-shadow:0 0 12px #f00;animation:sk .12s infinite}
@keyframes sk{0%{transform:translate(2px,-2px)}50%{transform:translate(-3px,2px)}100%{transform:translate(1px,3px)}}
@media (prefers-reduced-motion:reduce){.big{animation:none}}
#ui{z-index:4}#ph{position:fixed;left:0;right:0;top:0;bottom:80px;display:none;flex-direction:column;z-index:5;color:#111;background:#e8eef7}#ph.dr{background:#111;color:#fff}
#tg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;z-index:6}
.lh{background:#06c755;color:#fff;padding:12px;font-weight:bold;text-align:center;padding-top:calc(12px + env(safe-area-inset-top,0px))}.lg{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.b{max-width:75%;background:#fff;border-radius:14px;padding:8px 12px;align-self:flex-start;font-size:.95rem}.b small{display:block;opacity:.6;font-size:.75rem}.b.me{align-self:flex-end;background:#9be58a}.b img{width:150px;display:block;border-radius:8px}
.lf{padding:10px;display:flex;gap:8px;justify-content:center;background:#fff;flex-wrap:wrap}.lf button{color:#111;background:#eee;border-color:#999}
.li{display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border-bottom:1px solid #ddd;cursor:pointer}.li span{flex:1;opacity:.6;font-size:.85rem}.li i{background:#06c755;color:#fff;border-radius:10px;padding:0 7px;font-style:normal}
.tr{flex:1;margin:12px;border:14px solid #555;border-radius:12px;background:linear-gradient(90deg,#222 0 8px,transparent 8px) 0 0/140px 100% repeat-x,linear-gradient(#9dd6ff 55%,#4a8c3c 55%)}
</style></head><body>
<div id="top"></div><div id="ph"></div><button id="tg"></button><div id="ui"></div>
